<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">
    <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-6">
        
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Expense Tracker</h1>

        <div class="flex gap-2 mb-4">
            <input type="text" id="name" placeholder="Expense name"
                class="border border-gray-300 rounded-lg px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-400">
            <input type="number" id="amount" placeholder="Amount"
                class="border border-gray-300 rounded-lg px-3 py-2 w-24 focus:outline-none focus:ring-2 focus:ring-blue-400">
            <button id="add-btn"
                class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-medium">
                Add
            </button>
        </div>

        <div class="bg-blue-50 rounded-lg p-4 mb-4 text-center">
            <p class="text-sm text-gray-500">Total</p>
            <p class="text-3xl font-bold text-blue-600"><span id="total">0</span> SAR</p>
        </div>

        <ul id="expense-list" class="space-y-2"></ul>

    </div>
</div>

<script src="app.js"></script>
    <script src="app.js"></script>
</body>
</html>
